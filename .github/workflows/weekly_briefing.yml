name: Weekly Briefing

on:
  # Due orari per coprire ora solare (CET, UTC+1) e ora legale (CEST, UTC+2):
  # 17:00 UTC = 18:00 CET (inverno) · 16:00 UTC = 18:00 CEST (estate)
  # Lo script stesso verifica di essere nella finestra corretta e non invia
  # due volte (idempotenza gestita dal database + is_sunday_evening_window).
  schedule:
    - cron: "0 17 * * 0"
    - cron: "0 16 * * 0"
  # Permette anche l'avvio manuale da GitHub ("Run workflow"), con invio forzato
  workflow_dispatch:
    inputs:
      force:
        description: "Forza l'invio anche fuori dalla finestra oraria"
        type: boolean
        default: false

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui briefing
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python scripts/run_briefing.py --force
          else
            python scripts/run_briefing.py
          fi

      - name: Salva log come artifact (utile per debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-data
          path: data/
          retention-days: 14
