name: Weekly Briefing

on:
  # Due orari per coprire ora solare (CET, UTC+1) e ora legale (CEST, UTC+2).
  # Il cron nativo di GitHub Actions puo' scattare in ritardo o saltare del
  # tutto sui repository poco attivi: come rete di sicurezza affidabile,
  # un servizio esterno gratuito (cron-job.org) chiama questo stesso workflow
  # via API esattamente alle 18:00 Europe/Rome ogni domenica (vedi README).
  schedule:
    - cron: "0 17 * * 0"
    - cron: "0 16 * * 0"
  # Permette l'avvio manuale da GitHub ("Run workflow") E la chiamata da
  # cron-job.org, entrambi con invio forzato.
  workflow_dispatch:
    inputs:
      force:
        description: "Forza l'invio anche fuori dalla finestra oraria"
        type: boolean
        default: false

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Determina la settimana corrente (per la cache anti-duplicati)
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Ripristina storico invii
        # Con piu' trigger nella stessa domenica (cron GitHub + cron-job.org),
        # questa cache mantiene il database SQLite tra un'esecuzione e l'altra
        # cosi' il controllo "email gia' inviata questa settimana" funziona
        # davvero ed evita email doppie.
        uses: actions/cache@v4
        with:
          path: data
          key: briefing-data-${{ steps.week.outputs.week }}
          restore-keys: |
            briefing-data-

      - name: Esegui briefing
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python scripts/run_briefing.py --force
          else
            python scripts/run_briefing.py
          fi

      - name: Salva log come artifact (utile per debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-data
          path: data/
          retention-days: 14

  # Evita che GitHub disabiliti il workflow dopo 60 giorni di inattivita'.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: gautamkrishnar/keepalive-workflow@v2
